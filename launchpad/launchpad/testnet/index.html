<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Saturn project markets and staking on Stellar testnet.">
    <meta name="theme-color" content="#080909">
    <title>Saturn Launchpad</title>
  </head>
  <body>
    <saturn-shell></saturn-shell>
    <script type="module" src="/src/app-shell.js"></script>
    <header class="shell topbar">
      <div class="wallet"><a class="docs-link" href="/docs/#testnet">Docs</a><span class="network">Stellar testnet</span><button id="connect" class="secondary">Connect Freighter</button></div>
    </header>
    <main class="shell">
      <div class="intro"><h1>Launchpad</h1><p>Explore a project market, stake, or launch your own token on testnet.</p></div>
      <div class="workspace">
        <section class="panel project-panel" aria-label="Project market">
          <h2 class="section-label">Project market</h2>
          <p id="market-status" class="status" role="status">Loading project…</p>
          <div id="project" class="market" hidden>
            <div class="market-title"><p id="phase" class="network"></p><h3 id="project-title"></h3><p id="symbol" class="muted"></p></div>
            <dl id="metrics" class="metrics"></dl>
          </div>
          <details class="lookup">
            <summary>Find a project by contract ID</summary>
            <form id="lookup">
              <label for="token">Project token contract</label>
              <div class="input-row"><input id="token" name="token" required pattern="C[A-Z2-7]{55}" maxlength="56" autocomplete="off" spellcheck="false"><button class="secondary">Load project</button></div>
            </form>
          </details>
        </section>
        <section class="panel action" aria-labelledby="action-title">
          <nav class="tabs" aria-label="Launchpad actions">
            <button type="button" data-view="trade" aria-pressed="true">Trade</button>
            <button type="button" data-view="stake" aria-pressed="false">Stake</button>
            <button type="button" data-view="create" aria-pressed="false">Create project</button>
          </nav>
          <h2 id="action-title">Trade</h2>
          <form id="action-form"></form>
          <p id="action-status" class="status" role="status"></p>
          <div id="quote" class="review" hidden>
            <h3>Testnet quote</h3>
            <dl id="quote-details" class="metrics"></dl>
          </div>
          <div id="review" class="review" hidden>
            <h3>Review transaction</h3>
            <dl id="details" class="metrics"></dl>
            <div class="review-actions"><button id="submit" type="button">Sign and submit on testnet</button><button id="dismiss" class="secondary" type="button">Dismiss</button></div>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
