[package]
name = "saturn-launch-factory"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=28.0.0"
saturn-token-metadata = { path = "../token-metadata" }

[dev-dependencies]
soroban-sdk = { version = "=28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
